name: Weekly Instax Price Check

on:
  schedule:
    # Target: 10:15 AM UAE/Dubai time (UTC+4, no DST) = 06:15 UTC, Tuesdays.
    # Three staggered attempts instead of one: daily used to "just work"
    # not because GitHub's scheduler is reliable, but because 7 chances a
    # week smoothed over the occasional dropped/delayed fire - weekly gets
    # only one shot, so a single miss looks totally broken with no
    # near-term recovery. These three are 20-25 min apart, off the round
    # hour (contention risk) and spread across enough time to catch a fire
    # GitHub delays or drops. The guard step below skips real work on
    # whichever of these actually run once one has already succeeded that
    # day, so this can't cause a duplicate scrape or duplicate email.
    - cron: "15 6 * * 2"
    - cron: "35 6 * * 2"
    - cron: "0 7 * * 2"
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Skip if a run already succeeded today
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only matters for the redundant schedule fires above - a manual
          # "Run workflow" click always proceeds regardless.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          already_ran=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/weekly-scrape.yml/runs?status=success&event=schedule&per_page=10" \
            | jq --arg today "$today" '[.workflow_runs[] | select(.created_at | startswith($today))] | length')
          if [ "$already_ran" -gt 0 ]; then
            echo "A scheduled run already succeeded today ($today) - skipping this redundant fire."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run price check
        if: steps.guard.outputs.skip != 'true'
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          # Second line of defence. sheets_writer.py already retries transient
          # Sheets errors in-process; this catches anything that kills the
          # script outright (a scraper blowing up, a runner network blip).
          # The run is idempotent - every column is rewritten from scratch -
          # so a full re-run is always safe.
          attempts=2
          for attempt in $(seq 1 $attempts); do
            echo "::group::Attempt $attempt of $attempts"
            if python main.py; then
              echo "::endgroup::"
              echo "Succeeded on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::Attempt $attempt failed - retrying in 3 minutes."
              sleep 180
            fi
          done
          echo "::error::All $attempts attempts failed."
          exit 1
