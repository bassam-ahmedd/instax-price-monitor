name: Weekly Instax Price Check

on:
  schedule:
    # Target: 10:00 AM UAE/Dubai time (UTC+4, no DST) = 06:00 UTC, Tuesdays only.
    # Note: GitHub queues heavily at round hour marks, so the run may start
    # late. Move to "50 5 * * 2" if an earlier-but-punctual start is preferred.
    - cron: "0 6 * * 2"
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price check
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          # Second line of defence. sheets_writer.py already retries transient
          # Sheets errors in-process; this catches anything that kills the
          # script outright (a scraper blowing up, a runner network blip).
          # The run is idempotent - every column is rewritten from scratch -
          # so a full re-run is always safe.
          attempts=2
          for attempt in $(seq 1 $attempts); do
            echo "::group::Attempt $attempt of $attempts"
            if python main.py; then
              echo "::endgroup::"
              echo "Succeeded on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::Attempt $attempt failed - retrying in 3 minutes."
              sleep 180
            fi
          done
          echo "::error::All $attempts attempts failed."
          exit 1
